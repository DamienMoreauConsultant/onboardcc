kind = "web"
previewPath = "/"
title = "onboardcc — DCC"
version = "1.0.0"
id = "artifacts/onboardcc"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18882

[services.development]
run = "pnpm --filter @workspace/onboardcc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/onboardcc", "run", "build" ]
serve = "static"
publicDir = "artifacts/onboardcc/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18882"
BASE_PATH = "/"
